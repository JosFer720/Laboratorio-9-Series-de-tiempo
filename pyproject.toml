[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forecasting-lab"
version = "0.1.0"
description = "Reproducible electricity-load forecasting laboratory"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=1.26,<3",
  "pandas>=2.1,<3",
  "torch>=2.2,<3",
  "scikit-learn>=1.4,<2",
  "matplotlib>=3.8,<4",
]

[project.optional-dependencies]
forecasting = [
  "statsforecast>=2,<3",
  "lightgbm>=4,<5",
  "neuralforecast>=3,<4",
  "chronos-forecasting>=2,<3",
]
dev = ["pytest>=8,<9", "nbformat>=5.10,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--strict-markers --basetemp=.pytest-tmp"
